<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analisador de números</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <main>
        <form>
            <label for="txtnum">Digite um número (entre 1 a 100): </label>
            <input type="number" id="txtnum">
            <input type="button" value="Adicionar" onclick="adicionar()">
        </form>
        <select id="selnum" size="8">
            <option></option>
        </select> <br>
        <input type="button" value="Finalizar" onclick="resultado()">
    </main>
    <footer>
        <p>Criado por <a href="https://github.com/vickmoraisdev/">Vitória de Morais</a>.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
